name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.1"
            fabric_api: "0.145.1+26.1"
          - minecraft: "26.1.1"
            fabric_api: "0.145.4+26.1.1"
          - minecraft: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: guild-bridge-mc${{ matrix.minecraft }}
          path: |
            build/libs/guild-bridge-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
