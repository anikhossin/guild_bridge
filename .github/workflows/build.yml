name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.1"
            fabric_api: "0.145.1+26.1"
          - minecraft: "26.1.1"
            fabric_api: "0.145.4+26.1.1"
          - minecraft: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: guild-bridge-mc${{ matrix.minecraft }}
          path: |
            build/libs/guild-bridge-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: guild-bridge-mc*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          tag="v${version}"
          shopt -s nullglob
          jars=(dist/guild-bridge-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No mod jars were downloaded"
            find dist -type f
            exit 1
          fi
          {
            echo "Download the jar that matches your Minecraft version, plus Fabric Loader and Fabric API for that version."
            echo
            echo "| Minecraft | Jar |"
            echo "| --- | --- |"
            echo "| 26.1 | guild-bridge-${version}-mc26.1.jar |"
            echo "| 26.1.1 | guild-bridge-${version}-mc26.1.1.jar |"
            echo "| 26.1.2 | guild-bridge-${version}-mc26.1.2.jar |"
            echo "| 26.2 | guild-bridge-${version}-mc26.2.jar |"
          } > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${jars[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "${jars[@]}" \
              --target "${{ github.sha }}" \
              --title "Guild Bridge ${version}" \
              --notes-file release-notes.md
          fi
